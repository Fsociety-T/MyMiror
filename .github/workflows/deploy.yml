name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages serves this repo from the gh-pages branch (legacy mode), so the deploy
# is a plain push to that branch — hence contents: write rather than pages: write.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Project sites live at /<repo>/, so Vite needs the subpath.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Pages has no SPA rewrite rule. Serving index.html as the 404 page makes
      # a hard refresh on /insights boot the app instead of showing GitHub's 404.
      - run: cp dist/index.html dist/404.html

      # Without this, Pages' Jekyll pass drops files and dirs starting with "_".
      - run: touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}"
          # Force push: gh-pages holds only the latest build, never history.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
